# ai4trade dashboard (stage B1). Copied to /root/ai-launchkit/caddy-addon/ai4trade.conf on the VPS;
# the Caddyfile imports /etc/caddy/addons/*.conf. The app signs users in itself (DASHBOARD_USER,
# bcrypt DASHBOARD_PASSWORD_HASH) and sets secure cookies; /metrics is not served publicly.
ai4trade.8739.site {
    @internal path /metrics /metrics/*
    respond @internal 404
    reverse_proxy ai4trade-main:8080
    header {
        Strict-Transport-Security "max-age=31536000"
        X-Content-Type-Options nosniff
        Referrer-Policy no-referrer
        -Server
    }
}
