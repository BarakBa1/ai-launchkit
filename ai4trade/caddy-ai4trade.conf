# ai4trade dashboard (stage B1). Copied to /root/ai-launchkit/caddy-addon/ai4trade.conf on the VPS;
# the Caddyfile imports /etc/caddy/addons/*.conf. Caddy sign-in (basic_auth; user and bcrypt hash from
# AI4TRADE_BASIC_AUTH_USER and AI4TRADE_BASIC_AUTH_HASH in the caddy service environment) comes first.
# Then the app signs the operator in itself (DASHBOARD_USER, bcrypt DASHBOARD_PASSWORD_HASH) and sets
# secure cookies. /metrics is not served publicly.
ai4trade.8739.site {
    basic_auth {
        {$AI4TRADE_BASIC_AUTH_USER} {$AI4TRADE_BASIC_AUTH_HASH}
    }
    @internal path /metrics /metrics/*
    respond @internal 404
    reverse_proxy ai4trade-main:8080 {
        # The app counts sign-in failures per client address, read from the left-most X-Forwarded-For
        # entry when Caddy is the peer (ai-n8n-trading ops/web/auth.py). Overwrite the header so the
        # client cannot choose that entry.
        header_up X-Forwarded-For {remote_host}
    }
    header {
        Strict-Transport-Security "max-age=31536000"
        X-Content-Type-Options nosniff
        Referrer-Policy no-referrer
        -Server
    }
}
