# ai4trade app, production (paper) stack: stage B1 (ai-n8n-trading docs/migration/plan.md section 7.2).
#
# Deployed to /root/ai4trade/compose.yml on the VPS, next to two env files (mode 600, never in git):
#   operator.env  the operator's values (Alpaca paper keys, Slack, Miniflux, providers, DASHBOARD_USER,
#                 DASHBOARD_PASSWORD_HASH, HEARTBEAT_PING_URL; names in docs/reference/environment-variables.md)
#   db.env        POSTGRES_* for the ai4trade_app login (written on the VPS; the password is generated there)
# Later files win: db.env over operator.env, then `environment:` below over both.
#
#   cd /root/ai4trade && AI4TRADE_TAG=<git-sha> docker compose up -d
#
# Joins the launchkit network (postgres, miniflux, searxng, crawl4ai, weaviate, caddy). Every schedule
# starts disabled (ai4trade.schedules.enabled defaults to false); the kill switch row fails closed.

name: ai4trade

x-app: &app
  image: ai4trade:${AI4TRADE_TAG:?set AI4TRADE_TAG to the image git sha}
  restart: unless-stopped
  # Docker's default stop is 10 s; the app's shutdown budget is 20 s and a run can need more to settle
  # its claim and close the run as PROCESS_SHUTDOWN (review-v0.1 01-orchestration B-1, 07-platform-ops B2).
  stop_grace_period: 60s
  # No compose healthcheck: each image's own HEALTHCHECK applies, so every tag keeps the probe it was built
  # with. Images built from the /live Dockerfile probe liveness (not /ready, so a closed start gate never
  # marks a container unhealthy). Older images keep their /health probe, so a rollback to an older tag still
  # reaches `healthy`. The image HEALTHCHECK probes 127.0.0.1:8080, so AI4TRADE_HTTP_PORT in `environment`
  # below must stay 8080. Compose marks the container unhealthy; it does not restart it (no autoheal sidecar).
  volumes:
    # Vertex service-account key (host dir and file owned by uid 10001, read-only in the container).
    - ./secrets:/run/secrets/ai4trade:ro
  env_file:
    - path: operator.env
      required: true
    - path: db.env
      required: true
  environment: &env
    AI4TRADE_ENV: prod
    APCA_API_BASE_URL: https://paper-api.alpaca.markets
    AI4TRADE_HTTP_HOST: 0.0.0.0
    AI4TRADE_HTTP_PORT: "8080"
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/ai4trade/google_sa.json
  networks: [launchkit]
  deploy:
    resources:
      limits:
        memory: 1G
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  ai4trade-main:
    <<: *app
    container_name: ai4trade-main
    command: ["serve", "--role", "main"]

  ai4trade-guard:
    <<: *app
    container_name: ai4trade-guard
    command: ["serve", "--role", "guard"]

networks:
  launchkit:
    external: true
    name: localai_default
